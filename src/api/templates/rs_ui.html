<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Engine — AMT</title>
    <meta name="description" content="Single-stock Relative Strength analysis engine with synchronized candlestick, RS, delivery, and MTF charts.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-base: #06090f;
            --bg-elevated: #0c1018;
            --bg-panel: #0e1219;
            --bg-chart: #0a0e14;
            --surface: rgba(255, 255, 255, 0.025);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --border-chart: rgba(255, 255, 255, 0.04);
            --text-primary: #E8ECF4;
            --text-secondary: #7A8394;
            --text-muted: #4B5567;
            --accent-cyan: #38BDF8;
            --accent-teal: #2DD4BF;
            --accent-green: #26a69a;
            --accent-red: #ef5350;
            --accent-blue: #3B82F6;
            --accent-violet: #A78BFA;
            --accent-amber: #f5a623;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
            --radius-sm: 6px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── Navigation Bar ─── */
        .app-nav {
            background: rgba(6, 9, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            height: 48px;
            gap: 4px;
            flex-shrink: 0;
            z-index: 100;
        }
        .app-nav .brand {
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.5px;
            margin-right: 14px;
            white-space: nowrap;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-divider {
            width: 1px;
            height: 18px;
            background: var(--border);
            margin: 0 6px;
        }
        .app-nav a.nav-link {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .app-nav a.nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }
        .app-nav a.nav-link.active {
            color: white;
            background: rgba(56, 189, 248, 0.12);
            font-weight: 600;
        }
        .app-nav .nav-spacer { flex: 1; }
        .app-nav .home-btn {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .app-nav .home-btn:hover {
            color: white;
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.04);
        }

        /* ─── Control Header ─── */
        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
        }
        input, select {
            background-color: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.08);
        }

        button {
            background: linear-gradient(135deg, #0EA5E9, #3B82F6);
            color: white;
            border: none;
            padding: 7px 18px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-family: var(--font);
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            margin-top: 14px;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.2);
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
        }
        button:active {
            transform: translateY(0);
        }

        /* Period Pill Chips */
        .pill {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 0;
            transition: all 0.2s;
            font-family: var(--font-mono);
            font-weight: 600;
        }
        .pill:hover {
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-cyan);
            border-color: rgba(56, 189, 248, 0.2);
            box-shadow: none;
            transform: none;
        }

        /* ─── Chart Container ─── */
        .chart-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: var(--bg-chart);
        }

        .chart-panel {
            position: relative;
        }

        .chart-panel + .chart-panel {
            border-top: 1px solid var(--border-chart);
        }

        /* Chart Legend Overlays */
        .chart-legend {
            position: absolute;
            left: 12px;
            top: 10px;
            z-index: 10;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            pointer-events: none;
            line-height: 1.6;
        }
        .chart-legend strong {
            color: white;
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font);
            letter-spacing: -0.2px;
        }

        /* ─── Loading Spinner ─── */
        .loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.06);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ─── Error Banner ─── */
        .error-banner {
            background: rgba(239, 83, 80, 0.06);
            color: var(--accent-red);
            padding: 8px 16px;
            text-align: center;
            display: none;
            border-bottom: 1px solid rgba(239, 83, 80, 0.15);
            font-size: 12px;
            flex-shrink: 0;
            font-family: var(--font-mono);
        }

        /* ─── Autocomplete ─── */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-items {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 320px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            z-index: 999;
            max-height: 260px;
            overflow-y: auto;
            border-radius: var(--radius-md);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.03);
            display: none;
            backdrop-filter: blur(16px);
        }
        .autocomplete-items::-webkit-scrollbar { width: 4px; }
        .autocomplete-items::-webkit-scrollbar-track { background: transparent; }
        .autocomplete-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }

        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: background 0.12s;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover {
            background: rgba(56, 189, 248, 0.06);
        }
        .ac-symbol {
            font-weight: 700;
            color: var(--accent-cyan);
            font-size: 12px;
            font-family: var(--font);
        }
        .ac-name {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <nav class="app-nav">
        <a href="/" class="brand">AMT</a>
        <div class="nav-divider"></div>
        <a href="/screener_ui" class="nav-link">RS Screener</a>
        <a href="/mtf_screener_ui" class="nav-link">MTF Screener</a>
        <a href="/rs_ui" class="nav-link active">RS Engine</a>
        <a href="/india_sectors_ui" class="nav-link">India Sectors</a>
        <div class="nav-spacer"></div>
        <a href="/historical_ui" class="nav-link">⬇ Data Sync</a>
        <div class="nav-divider"></div>
        <a href="/" class="home-btn">⌂ Home</a>
    </nav>

    <header>
        <div class="control-group autocomplete-wrapper">
            <label>Target Stock</label>
            <input type="text" id="target" value="RELIANCE" placeholder="Type name or symbol..." autocomplete="off" style="width: 200px;">
            <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
        <div class="control-group">
            <label>Base Index</label>
            <select id="index">
                <option value="NSE_INDEX|Nifty 50">Nifty 50</option>
                <option value="NSE_INDEX|Nifty Bank">Nifty Bank</option>
                <option value="NSE_INDEX|Nifty 500">Nifty 500</option>
            </select>
        </div>
        <div class="control-group">
            <label>Period (Length)</label>
            <div style="display: flex; gap: 6px; align-items: center;">
                <input type="number" id="length" value="21" style="width: 60px;">
                <button class="pill" onclick="document.getElementById('length').value=21; fetchData()">21</button>
                <button class="pill" onclick="document.getElementById('length').value=55; fetchData()">55</button>
                <button class="pill" onclick="document.getElementById('length').value=123; fetchData()">123</button>
            </div>
        </div>
        <div class="control-group">
            <label>RS EMA</label>
            <input type="number" id="ema_length" value="50" style="width: 80px;">
        </div>
        <div class="control-group">
            <label>Price SMA</label>
            <input type="number" id="price_sma_length" value="50" style="width: 80px;">
        </div>
        <button id="update-btn">Calculate RS</button>
    </header>

    <div id="error" class="error-banner"></div>

    <div class="chart-container">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: var(--text-muted); font-size: 12px;">Crunching Data...</p>
        </div>
        <div class="chart-panel" style="height: 40%;">
            <div id="price-legend" class="chart-legend"></div>
            <div id="price-chart" style="height: 100%;"></div>
        </div>
        <div class="chart-panel" style="height: 20%;">
            <div id="rs-legend" class="chart-legend"></div>
            <div id="rs-chart" style="height: 100%;"></div>
        </div>
        <div class="chart-panel" style="height: 20%;">
            <div id="trend-legend" class="chart-legend" style="left: 85px;"></div>
            <div id="trend-chart" style="height: 100%;"></div>
        </div>
        <div class="chart-panel" style="height: 20%;">
            <div id="mtf-legend" class="chart-legend" style="left: 85px;"></div>
            <div id="mtf-chart" style="height: 100%;"></div>
        </div>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('error').innerText = `JS Error: ${error ? error.stack : message}`;
            document.getElementById('error').style.display = 'block';
        };
        
        window.addEventListener('unhandledrejection', function(event) {
            document.getElementById('error').innerText = `Promise Error: ${event.reason.stack || event.reason}`;
            document.getElementById('error').style.display = 'block';
        });

        const chartBg = '#0a0e14';
        const chartGrid = 'rgba(255,255,255,0.03)';
        const chartBorder = 'rgba(255,255,255,0.04)';

        const commonChartOptions = {
            layout: {
                background: { type: 'solid', color: chartBg },
                textColor: '#7A8394',
                fontFamily: "'JetBrains Mono', 'SF Mono', monospace",
                fontSize: 10,
            },
            grid: {
                vertLines: { color: chartGrid },
                horzLines: { color: chartGrid },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: 'rgba(56, 189, 248, 0.2)', labelBackgroundColor: '#0e1219' },
                horzLine: { color: 'rgba(56, 189, 248, 0.2)', labelBackgroundColor: '#0e1219' },
            },
            leftPriceScale: {
                visible: true,
                borderColor: chartBorder,
                minimumWidth: 75,
            },
            rightPriceScale: {
                borderColor: chartBorder,
                minimumWidth: 75,
            },
        };

        const priceChart = LightweightCharts.createChart(document.getElementById('price-chart'), {
            ...commonChartOptions,
            timeScale: {
                visible: false,
            }
        });
        
        const rsChart = LightweightCharts.createChart(document.getElementById('rs-chart'), {
            ...commonChartOptions,
            timeScale: {
                visible: false,
            }
        });

        const trendChart = LightweightCharts.createChart(document.getElementById('trend-chart'), {
            ...commonChartOptions,
            leftPriceScale: {
                visible: true,
                borderColor: chartBorder,
                minimumWidth: 75,
                scaleMargins: { top: 0.1, bottom: 0.1 },
            },
            rightPriceScale: {
                borderColor: chartBorder,
                minimumWidth: 75,
                scaleMargins: { top: 0.1, bottom: 0.1 },
            },
            timeScale: {
                visible: false,
            }
        });

        const mtfChart = LightweightCharts.createChart(document.getElementById('mtf-chart'), {
            ...commonChartOptions,
            leftPriceScale: {
                visible: true,
                borderColor: chartBorder,
                minimumWidth: 75,
                scaleMargins: { top: 0.3, bottom: 0.1 },
            },
            rightPriceScale: {
                borderColor: chartBorder,
                minimumWidth: 75,
                scaleMargins: { top: 0.3, bottom: 0.1 },
            },
            timeScale: {
                borderColor: chartBorder,
                timeVisible: true,
                rightOffset: 12,
            }
        });

        let globalLineData = [];
        let globalRsData = [];

        // Sync TimeScales for panning/zooming
        let isSyncing = false;
        function syncVisibleRanges(sourceScale, targets) {
            sourceScale.subscribeVisibleTimeRangeChange(range => {
                if (isSyncing || !range) return;
                isSyncing = true;
                targets.forEach(target => {
                    try { target.timeScale().setVisibleRange(range); } catch(e) {}
                });
                isSyncing = false;
            });
        }
        syncVisibleRanges(priceChart.timeScale(), [rsChart, trendChart, mtfChart]);
        syncVisibleRanges(rsChart.timeScale(), [priceChart, trendChart, mtfChart]);
        syncVisibleRanges(trendChart.timeScale(), [priceChart, rsChart, mtfChart]);
        syncVisibleRanges(mtfChart.timeScale(), [priceChart, rsChart, trendChart]);

        // Price Series (Candlestick)
        const lineSeries = priceChart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
            lastValueVisible: false,
            priceLineVisible: false
        });
        
        const volumeSeries = priceChart.addHistogramSeries({
            color: '#26a69a',
            priceFormat: { type: 'volume' },
            priceScaleId: '',
        });
        volumeSeries.priceScale().applyOptions({
            scaleMargins: { top: 0.85, bottom: 0 },
        });
        
        const priceSmaSeries = priceChart.addLineSeries({
            color: '#f5a623',
            lineWidth: 1,
            lineStyle: 1,
            lastValueVisible: false,
            priceLineVisible: false
        });

        // RS Series
        const rsSeries = rsChart.addBaselineSeries({
            baseValue: { type: 'price', price: 0 },
            topLineColor: 'rgba(38, 166, 154, 1)',
            topFillColor1: 'rgba(38, 166, 154, 0.4)',
            topFillColor2: 'rgba(38, 166, 154, 0.05)',
            bottomLineColor: 'rgba(239, 83, 80, 1)',
            bottomFillColor1: 'rgba(239, 83, 80, 0.05)',
            bottomFillColor2: 'rgba(239, 83, 80, 0.4)',
            lineWidth: 2,
            lastValueVisible: false,
            priceLineVisible: false
        });

        const rsEmaSeries = rsChart.addLineSeries({
            color: '#ff5252',
            lineWidth: 1,
            lastValueVisible: false,
            priceLineVisible: false
        });

        // Zero Line
        const zeroLine = rsChart.addLineSeries({
            color: '#787b86',
            lineWidth: 1,
            lineStyle: 2,
            lastValueVisible: false,
            priceLineVisible: false
        });

        const formatVolume = (vol) => {
            if (vol === undefined || vol === null) return '';
            const absVol = Math.abs(vol);
            const sign = vol < 0 ? '-' : '';
            if (absVol >= 10000000) return sign + (absVol / 10000000).toFixed(2) + ' Cr';
            if (absVol >= 100000) return sign + (absVol / 100000).toFixed(2) + ' L';
            if (absVol >= 1000) return sign + (absVol / 1000).toFixed(2) + ' K';
            return sign + Number(absVol).toFixed(2);
        };

        // Trend Series
        const trendSeries = trendChart.addBaselineSeries({
            baseValue: { type: 'price', price: 0 },
            topLineColor: 'rgba(38, 166, 154, 1)',
            topFillColor1: 'rgba(38, 166, 154, 0.4)',
            topFillColor2: 'rgba(38, 166, 154, 0.05)',
            bottomLineColor: 'rgba(239, 83, 80, 1)',
            bottomFillColor1: 'rgba(239, 83, 80, 0.05)',
            bottomFillColor2: 'rgba(239, 83, 80, 0.4)',
            lineWidth: 2,
            lastValueVisible: false
        });
        
        // Legends Logic
        const priceLegend = document.getElementById('price-legend');
        const rsLegend = document.getElementById('rs-legend');
        const trendLegend = document.getElementById('trend-legend');
        const mtfLegend = document.getElementById('mtf-legend');

        const mtfBookSeries = mtfChart.addAreaSeries({
            lineColor: '#2196f3',
            topColor: 'rgba(33, 150, 243, 0.4)',
            bottomColor: 'rgba(33, 150, 243, 0.0)',
            lineWidth: 2,
            priceFormat: {
                type: 'custom',
                formatter: (price) => '₹' + price.toFixed(2) + ' Cr'
            },
            lastValueVisible: false
        });

        const mtfChangeSeries = mtfChart.addHistogramSeries({
            color: '#26a69a',
            priceFormat: {
                type: 'custom',
                formatter: (price) => '₹' + price.toFixed(2) + ' Cr'
            },
            priceScaleId: 'left',
            lastValueVisible: false
        });

        function setLegendText(param) {
            let pSmaVal = 'N/A', rVal = 'N/A', rEmaVal = 'N/A';
            let o = 'N/A', h = 'N/A', l = 'N/A', c = 'N/A', v = 'N/A';
            let dVol = 'N/A', dPct = 'N/A', dEmaVal = 'N/A';
            let mtfBookVal = 'N/A', mtfChgVal = 'N/A';
            
            if (param && param.time) {
                const cData = param.seriesData.get(lineSeries);
                if (cData) {
                    o = cData.open.toFixed(2); h = cData.high.toFixed(2);
                    l = cData.low.toFixed(2); c = cData.close.toFixed(2);
                }
                const vData = param.seriesData.get(volumeSeries);
                if (vData) v = vData.value.toLocaleString();
                
                const pSma = param.seriesData.get(priceSmaSeries);
                if (pSma) pSmaVal = pSma.value.toFixed(2);
                
                const rD = param.seriesData.get(rsSeries);
                if (rD) rVal = rD.value.toFixed(4);
                
                const rEma = param.seriesData.get(rsEmaSeries);
                if (rEma) rEmaVal = rEma.value.toFixed(4);

                const trendData = param.seriesData.get(trendSeries);
                if (trendData) {
                    const tv = trendData.value;
                    const c = tv >= 0 ? '#26a69a' : '#ef5350';
                    dVol = `<span style="color:${c}">${tv.toFixed(4)}</span>`;
                }

                const mb = param.seriesData.get(mtfBookSeries);
                if (mb) mtfBookVal = '₹' + mb.value.toFixed(2) + ' Cr';

                const mc = param.seriesData.get(mtfChangeSeries);
                if (mc) {
                    const val = mc.value;
                    const sign = val >= 0 ? '+' : '';
                    mtfChgVal = sign + '₹' + val.toFixed(2) + ' Cr';
                }
            }
            
            const targetName = document.getElementById('target').value.toUpperCase();
            priceLegend.innerHTML = `<strong>${targetName}</strong>  O: <span style="color:#d1d4dc">${o}</span> H: <span style="color:#d1d4dc">${h}</span> L: <span style="color:#d1d4dc">${l}</span> C: <span style="color:#d1d4dc">${c}</span>  Vol: <span style="color:#d1d4dc">${v}</span>  <span style="color:#f5a623">SMA: ${pSmaVal}</span>`;
            rsLegend.innerHTML = `<strong>Relative Strength</strong>  <span style="color:#26a69a">RS: ${rVal}</span>  <span style="color:#ff5252">EMA: ${rEmaVal}</span>`;
            trendLegend.innerHTML = `<strong>Trend Indicator</strong>  Vol-Adj P: ${dVol}`;
            mtfLegend.innerHTML = `<strong>MTF Analysis</strong>  Outstanding Book: <span style="color:#2196f3">${mtfBookVal}</span>  Daily Net Change: <span style="color:${mtfChgVal.startsWith('-') ? '#ef5350' : '#26a69a'}">${mtfChgVal}</span>`;
        }

        priceChart.subscribeCrosshairMove(param => { 
            setLegendText(param);
            if(param && param.time) {
                const dp = globalRsData.find(d => d.time === param.time);
                if (dp) {
                    try { rsChart.setCrosshairPosition(dp.value, param.time, rsSeries); } catch(e){}
                    try { trendChart.setCrosshairPosition(dp.value, param.time, trendSeries); } catch(e){}
                    try { mtfChart.setCrosshairPosition(dp.value, param.time, mtfBookSeries); } catch(e){}
                }
            }
            else {
                rsChart.clearCrosshairPosition();
                trendChart.clearCrosshairPosition();
                mtfChart.clearCrosshairPosition();
            }
        });
        
        rsChart.subscribeCrosshairMove(param => { 
            setLegendText(param);
            if(param && param.time) {
                const dp = globalLineData.find(d => d.time === param.time);
                if (dp) {
                    try { priceChart.setCrosshairPosition(dp.close, param.time, lineSeries); } catch(e){}
                    try { trendChart.setCrosshairPosition(dp.close, param.time, trendSeries); } catch(e){}
                    try { mtfChart.setCrosshairPosition(dp.close, param.time, mtfBookSeries); } catch(e){}
                }
            }
            else {
                priceChart.clearCrosshairPosition();
                trendChart.clearCrosshairPosition();
                mtfChart.clearCrosshairPosition();
            }
        });

        trendChart.subscribeCrosshairMove(param => { 
            setLegendText(param);
            if(param && param.time) {
                const dp = globalLineData.find(d => d.time === param.time);
                if (dp) {
                    try { priceChart.setCrosshairPosition(dp.close, param.time, lineSeries); } catch(e){}
                    try { rsChart.setCrosshairPosition(dp.close, param.time, rsSeries); } catch(e){}
                    try { mtfChart.setCrosshairPosition(dp.close, param.time, mtfBookSeries); } catch(e){}
                }
            }
            else {
                priceChart.clearCrosshairPosition();
                rsChart.clearCrosshairPosition();
                mtfChart.clearCrosshairPosition();
            }
        });

        mtfChart.subscribeCrosshairMove(param => { 
            setLegendText(param);
            if(param && param.time) {
                const dp = globalLineData.find(d => d.time === param.time);
                if (dp) {
                    try { priceChart.setCrosshairPosition(dp.close, param.time, lineSeries); } catch(e){}
                    try { rsChart.setCrosshairPosition(dp.close, param.time, rsSeries); } catch(e){}
                    try { trendChart.setCrosshairPosition(dp.close, param.time, trendSeries); } catch(e){}
                }
            }
            else {
                priceChart.clearCrosshairPosition();
                rsChart.clearCrosshairPosition();
                trendChart.clearCrosshairPosition();
            }
        });

        // Handle Resizing
        window.addEventListener('resize', () => {
            priceChart.applyOptions({ width: document.getElementById('price-chart').clientWidth });
            rsChart.applyOptions({ width: document.getElementById('rs-chart').clientWidth });
            trendChart.applyOptions({ width: document.getElementById('trend-chart').clientWidth });
            mtfChart.applyOptions({ width: document.getElementById('mtf-chart').clientWidth });
        });

        function calculateEMA(data, period) {
            if (data.length < period) return [];
            const emaData = [];
            const k = 2 / (period + 1);
            
            let sum = 0;
            for (let i = 0; i < period; i++) {
                sum += data[i].value;
            }
            let ema = sum / period;
            emaData.push({ time: data[period - 1].time, value: ema });
            
            for (let i = period; i < data.length; i++) {
                ema = data[i].value * k + ema * (1 - k);
                emaData.push({ time: data[i].time, value: ema });
            }
            return emaData;
        }

        async function fetchData() {
            const target = document.getElementById('target').value;
            const index = document.getElementById('index').value;
            const length = document.getElementById('length').value;
            const ema_length = document.getElementById('ema_length').value;
            const price_sma_length = document.getElementById('price_sma_length').value;

            document.getElementById('loader').style.display = 'flex';
            document.getElementById('error').style.display = 'none';

            try {
                const response = await fetch(`/api/rs/calculate?target=${encodeURIComponent(target)}&index=${encodeURIComponent(index)}&length=${length}&ema_length=${ema_length}&price_sma_length=${price_sma_length}`);
                const res = await response.json();

                if (res.status === 'error') {
                    throw new Error(res.message);
                }

                const data = Array.isArray(res) ? res : res.data;
                const symbol = res.symbol || target;
                
                if (!data) {
                    throw new Error("Invalid data received from server");
                }

                // Fetch trend data
                let trendRows = [];
                try {
                    const trendRes = await fetch(`/api/rs/trend?symbol=${encodeURIComponent(symbol)}`);
                    const trendObj = await trendRes.json();
                    if (trendObj.status === 'success') {
                        trendRows = trendObj.data;
                    }
                } catch(e) {
                    console.warn("No trend data found or failed to fetch:", e);
                }

                // Fetch MTF data
                let mtfRows = [];
                try {
                    const mtfRes = await fetch(`/api/rs/mtf?symbol=${encodeURIComponent(symbol)}`);
                    const mtfObj = await mtfRes.json();
                    if (mtfObj.status === 'success') {
                        mtfRows = mtfObj.data;
                    }
                } catch(e) {
                    console.warn("No MTF data found or failed to fetch:", e);
                }
                
                // Parse Data
                const lineData = [];
                const volumeData = [];
                const priceSmaData = [];
                const rsData = [];
                const rsSmaData = [];
                const zeroData = [];

                const trendDataArray = [];

                const mtfBookData = [];
                const mtfChangeData = [];

                const trendMap = {};
                trendRows.forEach(row => {
                    if (row.date) {
                        trendMap[row.date] = row;
                    }
                });

                const mtfMap = {};
                mtfRows.forEach(row => {
                    if (row.date) {
                        mtfMap[row.date] = row;
                    }
                });

                let prevAmt = null;
                let prevTraded = null;
                let prevDeliverable = null;
                let prevDeliveryPct = null;

                const rsEmaData = [];
                data.forEach(row => {
                    const t = row.timestamp ? row.timestamp.split(' ')[0] : null;
                    if (!t) return;

                    if (row.close != null && isFinite(row.close)) {
                        const open = (row.open != null && isFinite(row.open)) ? row.open : row.close;
                        const close = row.close;
                        lineData.push({ 
                            time: t, 
                            open: open, 
                            high: (row.high != null && isFinite(row.high)) ? row.high : row.close, 
                            low: (row.low != null && isFinite(row.low)) ? row.low : row.close, 
                            close: close 
                        });
                        
                        if (row.volume != null && isFinite(row.volume)) {
                            volumeData.push({
                                time: t,
                                value: row.volume,
                                color: close >= open ? 'rgba(38, 166, 154, 0.4)' : 'rgba(239, 83, 80, 0.4)'
                            });
                        }

                        const tRow = trendMap[t];
                        if (tRow) {
                            trendDataArray.push({ time: t, value: tRow.trend_indicator });
                        }
                    }

                    
                    const mtfRow = mtfMap[t];
                    if (mtfRow) {
                        const amt = mtfRow.amt_crores;
                        mtfBookData.push({ time: t, value: amt });
                        if (prevAmt !== null) {
                            const change = amt - prevAmt;
                            mtfChangeData.push({
                                time: t,
                                value: change,
                                color: change >= 0 ? 'rgba(38, 166, 154, 0.75)' : 'rgba(239, 83, 80, 0.75)'
                            });
                        } else {
                            mtfChangeData.push({ time: t, value: 0, color: 'rgba(38, 166, 154, 0.75)' });
                        }
                        prevAmt = amt;
                    }
                    if (row.sma_price != null && isFinite(row.sma_price)) priceSmaData.push({ time: t, value: row.sma_price });
                    if (row.rs != null && isFinite(row.rs)) rsData.push({ time: t, value: row.rs });
                    if (row.ema_res != null && isFinite(row.ema_res)) rsEmaData.push({ time: t, value: row.ema_res });
                    zeroData.push({ time: t, value: 0 });
                });

                // Deduplicate data by time
                const uniqueByTime = (data) => {
                    const seen = new Set();
                    return data.filter(item => {
                        if (seen.has(item.time)) return false;
                        seen.add(item.time);
                        return true;
                    }).sort((a, b) => new Date(a.time) - new Date(b.time));
                };

                globalLineData = uniqueByTime(lineData);
                globalRsData = uniqueByTime(rsData);
                
                lineSeries.setData(globalLineData);
                volumeSeries.setData(uniqueByTime(volumeData));
                priceSmaSeries.setData(uniqueByTime(priceSmaData));
                rsSeries.setData(globalRsData);
                rsEmaSeries.setData(uniqueByTime(rsEmaData));
                zeroLine.setData(uniqueByTime(zeroData));

                trendSeries.setData(uniqueByTime(trendDataArray));

                mtfBookSeries.setData(uniqueByTime(mtfBookData));
                mtfChangeSeries.setData(uniqueByTime(mtfChangeData));

                priceChart.timeScale().fitContent();
                rsChart.timeScale().fitContent();
                trendChart.timeScale().fitContent();
                mtfChart.timeScale().fitContent();
                
                // Initialize Legend
                setLegendText({});

            } catch (err) {
                document.getElementById('error').innerText = err.stack || err.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        document.getElementById('update-btn').addEventListener('click', fetchData);
        
        // Autocomplete Logic
        const targetInput = document.getElementById('target');
        const acList = document.getElementById('autocomplete-list');
        let searchTimeout;

        targetInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const val = this.value;
            if (!val) {
                acList.style.display = 'none';
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/equity/search?query=${encodeURIComponent(val)}&search_type=all`);
                    const data = await res.json();
                    
                    acList.innerHTML = '';
                    if (data.status === 'success' && data.data.length > 0) {
                        data.data.slice(0, 15).forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'autocomplete-item';
                            div.innerHTML = `<span class="ac-symbol">${item.trading_symbol}</span><span class="ac-name">${item.name}</span>`;
                            div.addEventListener('click', () => {
                                targetInput.value = item.trading_symbol;
                                acList.style.display = 'none';
                                fetchData();
                            });
                            acList.appendChild(div);
                        });
                        acList.style.display = 'block';
                    } else {
                        acList.style.display = 'none';
                    }
                } catch(e) {
                    console.error("Autocomplete error", e);
                }
            }, 250);
        });

        document.addEventListener('click', function (e) {
            if (e.target !== targetInput) {
                acList.style.display = 'none';
            }
        });

        // Initial fetch
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('symbol')) {
            targetInput.value = urlParams.get('symbol');
        }
        
        setTimeout(fetchData, 500);
    </script>
</body>
